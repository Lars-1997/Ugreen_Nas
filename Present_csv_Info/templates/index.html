<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSV Viewer with DataTables</title>
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.0/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.0/css/dataTables.bootstrap5.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #f7f7f7;
            padding: 40px 20px;
        }
        .container-fluid {
            max-width: 1400px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: none;
        }
        .card-header {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            border-radius: 12px 12px 0 0 !important;
            padding: 24px;
        }
        .card-body {
            padding: 24px;
        }
        .table thead th {
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            vertical-align: top;
        }
        .table thead th input,
        .table thead th select {
            width: 100%;
            margin-top: 8px;
            font-size: 0.85rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px 8px;
        }
        .table thead th input:focus,
        .table thead th select:focus {
            outline: 2px solid #0d6efd;
            outline-offset: 2px;
        }
        .meta {
            margin-bottom: 16px;
            color: #666;
        }
        .dataTables_wrapper {
            margin-top: 16px;
        }
        .dataTables_length select {
            border-radius: 4px;
            border: 1px solid #ddd;
            padding: 4px 8px;
        }
        .dataTables_filter input {
            border-radius: 4px;
            border: 1px solid #ddd;
            padding: 4px 8px;
            margin-left: 8px;
        }
        .dataTables_info {
            color: #666;
        }
        .dataTables_paginate .page-link {
            border-radius: 4px;
            margin: 0 2px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="card">
            <div class="card-header">
                <h1 class="h3 mb-2">CSV Data Viewer</h1>
                <div class="meta">
                    <strong>Rows:</strong> {{ row_count }} | 
                    <strong>Columns:</strong> {{ columns | length }}
                </div>
            </div>
            <div class="card-body">
                <table id="csvTable" class="table table-striped" style="width:100%">
                    <thead>
                        <tr>
                            {% for col in columns %}
                            <th>{{ col }}</th>
                            {% endfor %}
                        </tr>
                        <tr>
                            {% for col in columns %}
                            <th>
                                {% if col in unique_values %}
                                <select class="column-filter" data-column="{{ loop.index0 }}">
                                    <option value="">All</option>
                                    {% for val in unique_values[col] %}
                                    <option value="{{ val }}">{{ val }}</option>
                                    {% endfor %}
                                </select>
                                {% else %}
                                <input type="text" class="column-filter" placeholder="Search {{ col }}" data-column="{{ loop.index0 }}">
                                {% endif %}
                            </th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="{{ columns | length }}" class="loading">
                                Loading data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/2.2.0/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.2.0/js/dataTables.bootstrap5.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Initialize DataTable with AJAX
            var table = $('#csvTable').DataTable({
                processing: true,
                serverSide: true,
                ajax: {
                    url: '/api/data',
                    type: 'GET',
                    dataSrc: 'data'
                },
                columns: [],
                order: [[0, 'asc']],
                pageLength: 10,
                lengthMenu: [10, 25, 50, 100],
                language: {
                    processing: "Loading data...",
                    search: "Global search:",
                    lengthMenu: "Show _MENU_ entries",
                    info: "Showing _START_ to _END_ of _TOTAL_ entries",
                    infoEmpty: "No entries available",
                    infoFiltered: "(filtered from _MAX_ total entries)",
                    paginate: {
                        first: "First",
                        last: "Last",
                        next: "Next",
                        previous: "Previous"
                    }
                },
                initComplete: function() {
                    // Load column definitions
                    $.ajax({
                        url: '/api/columns',
                        type: 'GET',
                        success: function(columns) {
                            table.settings()[0].aoColumns = columns;
                            table.clear();
                            table.ajax.reload();
                        }
                    });
                    
                    // Column filter event handlers
                    $('.column-filter').on('keyup change', function() {
                        var column = $(this).data('column');
                        var value = $(this).val();
                        table.column(column).search(value).draw();
                    });
                }
            });
        });
    </script>
</body>
</html>
